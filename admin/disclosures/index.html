<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e6">
<meta name="robots" content="noindex,nofollow">
<title>공시 모니터 · Snowshagal Admin</title>
<link rel="stylesheet" href="/assets/site.css?v=1efc69cb5c">
<link rel="stylesheet" href="/assets/ui-polish.css?v=26a4fe9976">
<style>
.disclosures{padding:52px 0 80px}.disc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px}.disc-head h1{margin:0;font-size:clamp(32px,5vw,52px);letter-spacing:-.05em;line-height:1.05}.disc-head p{margin:10px 0 0;color:var(--text-2);font-size:13px}.toplink{display:inline-flex;margin-bottom:12px;color:var(--text-2);font-size:12px;font-weight:800}.disc-note{font-size:11px;color:var(--muted);text-align:right}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.disc-auth{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:850;color:var(--text-2)}.field input,.field select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:9px 11px}.actions{display:flex;gap:8px}.btn{min-height:42px;border:1px solid var(--line);border-radius:999px;padding:0 16px;background:var(--panel-2);color:var(--text);font:inherit;font-size:12px;font-weight:850;cursor:pointer}.btn.primary{background:var(--text);border-color:var(--text);color:var(--bg)}.btn:disabled{opacity:.4;cursor:not-allowed}.status{min-height:20px;margin:10px 2px 0;color:var(--muted);font-size:11px}.status.error{color:var(--brown)}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.metric span{display:block;color:var(--muted);font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.metric strong{display:block;margin-top:7px;font:600 22px Georgia,serif}.metric small{display:block;margin-top:4px;color:var(--text-2);font-size:10px;line-height:1.45}.toolbar{display:grid;grid-template-columns:1fr 180px;gap:10px;margin:14px 0}.feed{display:grid;gap:9px}.filing{display:grid;grid-template-columns:84px minmax(0,1fr) 118px;gap:14px;align-items:start}.date{font:600 12px Georgia,serif;color:var(--text-2)}.date small{display:block;margin-top:5px;font:700 9px system-ui;color:var(--muted)}.corp{font-size:11px;font-weight:850}.stock{margin-left:6px;color:var(--muted);font-size:9px}.report{margin:5px 0 0;font-size:14px;font-weight:750;line-height:1.45;letter-spacing:-.02em}.reasons{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.reason{border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:var(--text-2);font-size:9px}.priority{display:inline-flex;align-items:center;justify-content:center;min-height:26px;border:1px solid var(--line);border-radius:999px;padding:0 9px;font-size:9px;font-weight:900;text-transform:uppercase}.priority.critical{border-color:var(--brown);color:var(--brown)}.priority.high{border-color:var(--green);color:var(--green)}.priority.medium{color:var(--text-2)}.filing-actions{display:grid;gap:6px}.filing-actions a,.filing-actions button{display:flex;align-items:center;justify-content:center;min-height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--text);font:inherit;font-size:10px;font-weight:800;text-decoration:none;cursor:pointer}.ai{grid-column:2/4;margin-top:-3px;padding:11px 12px;border-left:2px solid var(--line);background:color-mix(in srgb,var(--panel-2) 55%,transparent)}.ai strong{font-size:11px}.ai p{margin:5px 0 0;color:var(--text-2);font-size:11px;line-height:1.6}.ai ul{margin:6px 0 0;padding-left:17px;color:var(--text-2);font-size:10px}.ai-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:9px}.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:12px}.config{margin-top:14px;padding:12px 14px;color:var(--muted);font-size:10px;line-height:1.65}.config code{color:var(--text-2)}
@media(max-width:800px){.disclosures{padding:34px 0 58px}.disc-head{display:block}.disc-note{text-align:left;margin-top:10px}.disc-auth{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.filing{grid-template-columns:64px minmax(0,1fr)}.filing-actions{grid-column:1/-1;grid-template-columns:1fr 1fr}.ai{grid-column:1/-1;margin-top:0}.report{font-size:13px}}
@media(max-width:430px){.summary{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.filing{grid-template-columns:1fr}.date small{display:inline;margin-left:6px}.filing-actions{grid-template-columns:1fr 1fr}}
</style>
<script>try{const t=localStorage.getItem('site-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
<header class="site-header"><div class="site-wrap"><div class="header-row"><a class="brand" href="../../"><i></i>SNOWSHAGAL</a><div class="header-actions"><button class="icon-btn" type="button" id="theme-toggle" aria-label="다크 모드로 전환">◐</button></div></div></div></header>
<main class="disclosures"><div class="site-wrap">
  <div class="disc-head"><div><a class="toplink" href="../">← 관리자</a><h1>공시 모니터</h1><p>OpenDART에서 상장사 공시를 모으고 규칙 엔진으로 먼저 거른 뒤, 중요한 항목만 AI가 1차 분류합니다.</p></div><div class="disc-note">무료 API 예산 보호 · 원문 수치는 추정하지 않음</div></div>
  <section class="card disc-auth"><div class="field"><label for="admin-key">관리자 키</label><input id="admin-key" type="password" autocomplete="current-password" placeholder="Cloudflare ADMIN_KEY"></div><div class="actions"><button id="load" class="btn" type="button">저장 데이터 조회</button><button id="sync" class="btn primary" type="button">OpenDART 동기화</button></div></section>
  <div id="status" class="status" aria-live="polite">관리자 키를 입력하면 조회할 수 있습니다.</div>
  <section id="dashboard" hidden>
    <div class="summary">
      <article class="card metric"><span>Stored filings</span><strong id="stored-count">0</strong><small id="last-sync">마지막 동기화 —</small></article>
      <article class="card metric"><span>OpenDART today</span><strong id="dart-usage">0</strong><small id="dart-budget">내부 예산 —</small></article>
      <article class="card metric"><span>AI today</span><strong id="llm-usage">0</strong><small id="llm-budget">내부 예산 —</small></article>
      <article class="card metric"><span>AI provider</span><strong id="llm-provider" style="font-size:16px">—</strong><small id="llm-model">—</small></article>
    </div>
    <div class="toolbar"><div class="field"><label for="search">검색</label><input id="search" type="search" placeholder="회사명 · 종목코드 · 공시명"></div><div class="field"><label for="priority">중요도</label><select id="priority"><option value="all">전체</option><option value="medium">Medium+</option><option value="high">High+</option><option value="critical">Critical</option></select></div></div>
    <div id="feed" class="feed"></div>
    <div id="config" class="card config"></div>
  </section>
</div></main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const key = $('admin-key'); const load = $('load'); const sync = $('sync'); const status = $('status'); const dashboard = $('dashboard'); const feed = $('feed');
  let current = [];
  try { key.value = sessionStorage.getItem('mrs-admin-key') || ''; } catch (_) {}
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = raw => /^\d{8}$/.test(raw || '') ? `${raw.slice(0,4)}.${raw.slice(4,6)}.${raw.slice(6,8)}` : raw || '—';
  function setStatus(message, error=false){ status.textContent=message; status.classList.toggle('error',error); }
  function auth(){ const value=key.value.trim(); try{sessionStorage.setItem('mrs-admin-key',value)}catch(_){} return value; }
  function usageCount(usage,prefix){ return Object.entries(usage||{}).filter(([k])=>k.startsWith(prefix)).reduce((n,[,v])=>n+Number(v.requests||0),0); }
  function render(data){
    current = Array.isArray(data.filings) ? data.filings : (Array.isArray(data.latest)?data.latest:current);
    dashboard.hidden=false; $('stored-count').textContent=current.length;
    const state=data.state||{}; $('last-sync').textContent=state.last_sync_at?.value ? `마지막 동기화 ${new Date(state.last_sync_at.value).toLocaleString('ko-KR')}`:'아직 동기화 없음';
    const cfg=data.config||{}; const usage=data.usage||{}; const dart=usageCount(usage,'source:opendart'); const llm=Number(usage['llm:total']?.requests||0);
    $('dart-usage').textContent=dart; $('dart-budget').textContent=`내부 일일 예산 ${cfg.dartDailyBudget??'—'}회`;
    $('llm-usage').textContent=llm; $('llm-budget').textContent=`내부 일일 예산 ${cfg.llmDailyBudget??'—'}회 · 동기화당 ${cfg.llmPerRun??'—'}회`;
    $('llm-provider').textContent=cfg.llmProvider||'none'; $('llm-model').textContent=cfg.llmModel||'AI 비활성';
    $('config').innerHTML=`Source <code>${esc(cfg.sourceProvider||'opendart')}</code> · Classes <code>${esc((cfg.corpClasses||[]).join(','))}</code> · Source key ${cfg.sourceConfigured?'configured':'missing'} · LLM ${cfg.llmConfigured?'configured':'missing'}${cfg.llmFallbackProvider&&cfg.llmFallbackProvider!=='none'?` · fallback <code>${esc(cfg.llmFallbackProvider)}</code>`:''}<br>AI 결과는 공시 목록 메타데이터 기반 1차 분류입니다. 금액·계약조건·실적수치 등은 DART 원문을 열어 확인해야 합니다.`;
    renderFeed();
  }
  function renderFeed(){
    const q=$('search').value.trim().toLowerCase(); const floor={all:0,medium:5,high:7,critical:10}[$('priority').value]||0;
    const rows=current.filter(f=>Number(f.rule?.score||0)>=floor && (!q || `${f.corpName} ${f.stockCode} ${f.reportName}`.toLowerCase().includes(q)));
    if(!rows.length){ feed.innerHTML='<div class="card empty">조건에 맞는 공시가 없습니다.</div>'; return; }
    feed.innerHTML=rows.map(f=>{
      const ai=f.ai?.result; const reasons=(f.rule?.reasons||[]).map(r=>`<span class="reason">${esc(r)}</span>`).join('');
      const aiBlock=ai?`<div class="ai"><strong>${esc(ai.headline||'AI 1차 분류')}</strong><p>${esc(ai.summary||'')}</p>${(ai.watch_points||[]).length?`<ul>${ai.watch_points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="ai-meta"><span>${esc(ai.impact||'neutral')}</span><span>urgency ${esc(ai.urgency||'low')}</span><span>confidence ${Number(ai.confidence||0)}%</span><span>${esc(f.ai.provider)} · ${esc(f.ai.model)}</span></div></div>`:`<div class="ai"><strong>${f.rule?.aiEligible?'AI 분석 대기':'규칙 분류만 적용'}</strong><p>${f.ai?.error?esc(f.ai.error):'원문에 없는 사실은 생성하지 않습니다.'}</p></div>`;
      return `<article class="card filing" data-rcept="${esc(f.rceptNo)}"><div class="date">${esc(fmtDate(f.receiptDate))}<small>${esc(f.corpCls)} · score ${Number(f.rule?.score||0)}</small></div><div><div class="corp">${esc(f.corpName)}${f.stockCode?`<span class="stock">${esc(f.stockCode)}</span>`:''}</div><p class="report">${esc(f.reportName)}</p><div class="reasons">${reasons}</div></div><div class="filing-actions"><span class="priority ${esc(f.rule?.priority||'low')}">${esc(f.rule?.priority||'low')}</span><a href="${esc(f.sourceUrl)}" target="_blank" rel="noopener">DART 원문 ↗</a>${f.rule?.aiEligible?`<button type="button" data-analyze="${esc(f.rceptNo)}">AI ${f.ai?.status==='done'?'재분석':'분석'}</button>`:''}</div>${aiBlock}</article>`;
    }).join('');
    feed.querySelectorAll('[data-analyze]').forEach(btn=>btn.addEventListener('click',()=>analyze(btn.dataset.analyze,btn)));
  }
  async function request(url,options={}){ const res=await fetch(url,{...options,headers:{...(options.headers||{}),'X-Admin-Key':auth()}}); const data=await res.json().catch(()=>({})); if(!res.ok) throw new Error(data.message||data.error||`HTTP ${res.status}`); return data; }
  async function loadData(){ if(!auth()){setStatus('관리자 키를 입력해 주세요.',true);return;} load.disabled=sync.disabled=true; setStatus('저장된 공시를 불러오는 중…'); try{const data=await request('/api/disclosures/latest?limit=200');render(data);setStatus(`공시 ${data.filings.length}건을 불러왔습니다.`);}catch(e){setStatus(e.message,true)}finally{load.disabled=sync.disabled=false} }
  async function syncData(){ if(!auth()){setStatus('관리자 키를 입력해 주세요.',true);return;} load.disabled=sync.disabled=true; setStatus('OpenDART 동기화 중… 규칙 필터 후 제한된 수만 AI 분석합니다.'); try{const data=await request('/api/disclosures/sync',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});setStatus(`동기화 완료 · ${data.source.fetched}건 확인 · 신규 ${data.source.created}건 · AI ${data.ai.completed}건`);await loadData();}catch(e){setStatus(e.message,true)}finally{load.disabled=sync.disabled=false} }
  async function analyze(rceptNo,button){button.disabled=true;setStatus('선택한 공시를 AI가 1차 분석 중…');try{const data=await request('/api/disclosures/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rceptNo})});const i=current.findIndex(f=>f.rceptNo===rceptNo);if(i>=0)current[i]=data.filing;renderFeed();setStatus('AI 분석을 저장했습니다.');}catch(e){setStatus(e.message,true)}finally{button.disabled=false}}
  load.addEventListener('click',loadData); sync.addEventListener('click',syncData); $('search').addEventListener('input',renderFeed); $('priority').addEventListener('change',renderFeed); key.addEventListener('change',auth);
  $('theme-toggle').addEventListener('click',()=>{const html=document.documentElement;const next=html.dataset.theme==='dark'?'light':'dark';html.dataset.theme=next;try{localStorage.setItem('site-theme',next)}catch(_){}});
  if(key.value) loadData();
})();
</script>
</body>
</html>
