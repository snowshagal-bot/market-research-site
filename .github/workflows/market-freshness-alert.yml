name: Production MARKET Freshness Alert

on:
  schedule:
    # 17:00 KST (08:00 UTC) and 18:00 KST (09:00 UTC) on weekdays.
    # 17:00 KST verifies regular trading days after the 16:30 KST grace cutoff.
    # 18:00 KST verifies special trading days (e.g. CSAT delayed close) after the 17:30 KST grace cutoff.
    - cron: "0 8,9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-market-freshness-alert
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Production MARKET freshness
        id: freshness
        continue-on-error: true
        run: node scripts/check-market-freshness.mjs

      - name: Open or update the operator alert
        if: steps.freshness.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Alert] Production MARKET freshness failure';
            const marker = '<!-- snowshagal-market-freshness-alert -->';
            const body = `${marker}\nProduction MARKET freshness verification failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck SOURCE → INGEST → STORAGE → PUBLIC API before modifying visible HOME/MARKET data.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Freshness check failed again: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Close a recovered operator alert
        if: steps.freshness.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Alert] Production MARKET freshness failure';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Recovered: Production MARKET freshness passed in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
            }

      - name: Fail the workflow after alerting
        if: steps.freshness.outcome == 'failure'
        run: exit 1
