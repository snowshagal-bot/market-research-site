name: OpenDART Daily Sync

on:
  schedule:
    # 16:05 KST on weekdays (07:05 UTC)
    - cron: "5 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: opendart-daily-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Trigger OpenDART daily sync
        id: sync
        continue-on-error: true
        env:
          DISCLOSURE_SYNC_KEY: ${{ secrets.DISCLOSURE_SYNC_KEY }}
        run: node scripts/sync-disclosures.mjs

      - name: Open or update the operator alert
        if: steps.sync.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Alert] OpenDART daily sync failure';
            const marker = '<!-- snowshagal-disclosure-sync-alert -->';
            const body = `${marker}\nOpenDART daily disclosure synchronization failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck DISCLOSURE_SYNC_KEY secret configuration and OpenDART API quota before manually retrying from Admin.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Daily sync failed again: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Close a recovered operator alert
        if: steps.sync.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Alert] OpenDART daily sync failure';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Recovered: OpenDART daily sync passed in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
            }

      - name: Fail the workflow after alerting
        if: steps.sync.outcome == 'failure'
        run: exit 1
