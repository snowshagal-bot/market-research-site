name: OpenDART Daily Sync

on:
  schedule:
    # 16:05 KST on weekdays (07:05 UTC). GitHub often starts it hours late; the
    # script still syncs this slot's date (scripts/sync-disclosures.mjs).
    - cron: "5 7 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Sync exactly this KST date (YYYY-MM-DD), e.g. to backfill a missed day. Empty: today plus the previous KRX trading day."
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: opendart-daily-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Trigger OpenDART daily sync
        id: sync
        continue-on-error: true
        env:
          DISCLOSURE_SYNC_KEY: ${{ secrets.DISCLOSURE_SYNC_KEY }}
          # A scheduled run syncs its slot's date and the previous KRX trading
          # day; a dispatch with a date syncs exactly that date.
          SYNC_EVENT: ${{ github.event_name }}
          SYNC_DATE: ${{ inputs.date }}
          DISCLOSURE_SYNC_RESULT: ${{ runner.temp }}/disclosure-sync-result.json
        run: node scripts/sync-disclosures.mjs

      - name: Update the operator alert
        if: steps.sync.outcome == 'success' || steps.sync.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          DISCLOSURE_SYNC_RESULT: ${{ runner.temp }}/disclosure-sync-result.json
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        with:
          script: |
            const fs = require('fs');
            const { ALERT_TITLE, planAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/disclosure-sync-alert.mjs`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let result = null;
            try { result = JSON.parse(fs.readFileSync(process.env.DISCLOSURE_SYNC_RESULT, 'utf8')); } catch (_) {}
            if (!result || (process.env.SYNC_OUTCOME === 'failure' && result.ok)) {
              // The sync step died before it could write its result. That is still a failure.
              result = { ...(result || {}), ok: false, report: 'the sync step failed without writing its result (see the run log)' };
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === ALERT_TITLE && !issue.pull_request) || null;
            const plan = planAlert({ issue: existing && { number: existing.number, body: existing.body || '' }, result, runUrl });
            const target = { owner: context.repo.owner, repo: context.repo.repo };
            core.info(`alert plan: ${plan.action}`);
            if (plan.action === 'create') {
              await github.rest.issues.create({ ...target, title: ALERT_TITLE, body: plan.body });
            } else if (existing && plan.action === 'update') {
              await github.rest.issues.update({ ...target, issue_number: existing.number, body: plan.body });
              await github.rest.issues.createComment({ ...target, issue_number: existing.number, body: plan.comment });
            } else if (existing && plan.action === 'comment') {
              await github.rest.issues.createComment({ ...target, issue_number: existing.number, body: plan.comment });
            } else if (existing && plan.action === 'close') {
              await github.rest.issues.createComment({ ...target, issue_number: existing.number, body: plan.comment });
              await github.rest.issues.update({ ...target, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
            }

      - name: Fail the workflow after alerting
        if: steps.sync.outcome == 'failure'
        run: exit 1
