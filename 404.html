<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e6">
<meta name="robots" content="noindex,nofollow">
<title>페이지를 찾을 수 없습니다 · Snowshagal</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
.not-found-page{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}
.not-found-header{border-bottom:1px solid var(--line)}
.not-found-header .header-row{justify-content:space-between}
.not-found-home{font-size:12px;font-weight:800;color:var(--text-2)}
.not-found-main{display:grid;place-items:center;padding:64px 0}
.not-found-card{width:min(100%,720px);border-block:1px solid var(--line);padding:52px 0}
.not-found-code{margin:0 0 14px;color:var(--green);font-size:12px;font-weight:900;letter-spacing:.16em}
.not-found-card h1{margin:0;font-size:clamp(32px,6vw,56px);line-height:1.12;letter-spacing:-.055em}
.not-found-copy{max-width:48ch;margin:18px 0 28px;color:var(--text-2);font-size:14px}
@media(max-width:760px){.not-found-main{padding:44px 0}.not-found-card{padding:38px 0}.not-found-home{font-size:11px}}
</style>
</head>
<body class="not-found-page">
<header class="not-found-header">
  <div class="site-wrap header-row">
    <a class="brand" href="/"><i></i>MARKET RESEARCH</a>
    <a class="not-found-home" href="/">홈페이지</a>
  </div>
</header>
<main class="not-found-main">
  <div class="site-wrap">
    <section class="not-found-card" aria-labelledby="not-found-title">
      <p class="not-found-code">404 · PAGE NOT FOUND</p>
      <h1 id="not-found-title">페이지를 찾을 수 없습니다.</h1>
      <p class="not-found-copy">주소가 변경되었거나 존재하지 않는 페이지입니다. 홈페이지에서 공개된 최신 리포트를 확인해 주세요.</p>
      <a class="read-link" href="/">홈페이지로 돌아가기 <span class="arrow" aria-hidden="true">→</span></a>
    </section>
  </div>
</main>
<footer class="footer">
  <div class="site-wrap">
    <div class="footer-primary">
      <div class="footer-brand-col">
        <span class="footer-brand">
          <img class="footer-brand-owl" src="/assets/brand/snowshagal-owl.webp" alt="" width="232" height="256" aria-hidden="true">
          <span>SNOWSHAGAL</span>
        </span>
        <p class="footer-tagline">시장을 읽어주는 사이트.</p>
      </div>
      <div class="footer-nav-col">
        <nav class="footer-links" aria-label="사이트 링크">
          <a href="/about/">소개</a>
          <a href="/about/#contact">문의</a>
        </nav>
        <a class="footer-email" href="mailto:contact@snowshagal.com">contact@snowshagal.com</a>
      </div>
    </div>
    <div class="footer-meta">
      <p class="footer-disclaimer">본 사이트의 리서치와 해설은 정보 제공을 목적으로 하며, 특정 금융투자상품에 대한 투자자문 또는 매수·매도 권유를 제공하지 않습니다.</p>
      <p class="footer-copy">© 2026 SNOWSHAGAL</p>
    </div>
  </div>
</footer>
</body>
</html>
