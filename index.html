<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e6">
<title>Market Research</title>
<meta name="description" content="데일리·위클리·비정기 시장 리서치를 모아보는 개인 리서치 아카이브.">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/category-state.css">
<script>try{const t=localStorage.getItem('site-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
<header class="site-header">
  <div class="site-wrap">
    <div class="header-row">
      <a class="brand" href="./"><i></i>MARKET RESEARCH</a>
      <nav class="main-nav" aria-label="주 메뉴">
        <a data-nav-category="daily" href="?category=daily">데일리</a>
        <a data-nav-category="weekly" href="?category=weekly">위클리</a>
        <a data-nav-category="research" href="?category=research">비정기</a>
        <a data-nav-category="note" href="?category=note">끄적끄적</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="다크 모드 전환">◐</button>
        <button class="icon-btn menu-btn" type="button" data-menu-toggle aria-label="메뉴 열기" aria-expanded="false">☰</button>
      </div>
    </div>
    <nav class="mobile-nav" aria-label="모바일 메뉴">
      <a data-nav-category="daily" href="?category=daily">데일리</a><a data-nav-category="weekly" href="?category=weekly">위클리</a>
      <a data-nav-category="research" href="?category=research">비정기</a><a data-nav-category="note" href="?category=note">끄적끄적</a>
    </nav>
  </div>
</header>
<div class="marketbar" aria-label="시장 지표" hidden>
  <div class="site-wrap"><span class="market-label">MARKET</span><span class="market-placeholder">시장 데이터 영역</span></div>
</div>
<main>
<section class="hero">
  <div class="site-wrap hero-grid">
    <div>
      <div class="eyebrow" data-feature-type>비정기 리서치</div>
      <h1><span class="sr-only">대표 리포트:</span><b data-feature-title>누가 열쇠를 쥐는가</b><span data-feature-subtitle>소버린 AI의 여러 얼굴</span></h1>
      <p class="hero-desc" data-feature-desc></p>
      <a class="read-link" data-feature-link href="#">리포트 읽기 <span class="arrow">→</span></a>
    </div>
    <div class="hero-meta">
      <div class="meta-row"><span>발행일</span><b data-feature-date>2026-08-09</b></div>
    </div>
  </div>
</section>
<section class="section">
  <div class="site-wrap">
    <div class="section-head"><h2>리포트 아카이브</h2><span>최신순</span></div>
    <div class="toolbar">
      <label class="search"><span class="sr-only">리포트 검색</span><input id="search-input" type="search" placeholder="제목·내용 검색"></label>
      <div class="filters" aria-label="카테고리 필터">
        <button class="filter active" data-filter="all">전체</button>
        <button class="filter" data-filter="daily">데일리</button>
        <button class="filter" data-filter="weekly">위클리</button>
        <button class="filter" data-filter="research">비정기</button>
        <button class="filter" data-filter="note">끄적끄적</button>
      </div>
    </div>
    <div id="report-list" class="report-list"></div>
  </div>
</section>
</main>
<footer class="footer"><div class="site-wrap footer-row"><span>Independent Market Research Archive</span><div class="footer-links"><a href="#" aria-label="티스토리 링크는 추후 연결">Tistory</a><a href="#">About</a></div></div></footer>
<script src="data/posts.js"></script>
<script src="assets/site.js"></script>

</html>
